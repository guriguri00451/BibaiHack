<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seeker AR</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; background: #111; color: #fff; }
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; pointer-events: none; }
    #overlay > * { pointer-events: auto; }
    #start { font-size: 18px; padding: 14px 28px; border-radius: 8px; border: 0; }
    #start[hidden] { display: none; }
    #status { background: rgba(0,0,0,.6); padding: 6px 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="status">確認中…</div>
    <button id="start" hidden>ARを開始</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
