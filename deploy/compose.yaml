# bibai-game VM（wds-pve VMID 100）の本番構成。https://bibai.t0waxx.com
# VM では /opt/bibai に置き、.env で SERVER_DIR=./server を指定する（README 参照）
name: bibai
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build: ${SERVER_DIR:-../server}
    environment:
      DATABASE_URL: postgres://bibai:${POSTGRES_PASSWORD:?}@postgres:5432/bibai
      JWT_SECRET: ${JWT_SECRET:?}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bibai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: bibai
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibai -d bibai"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
