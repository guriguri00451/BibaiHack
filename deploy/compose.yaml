    build: ./envs/dev/server
    image: bibai-server:dev
    environment:
      NODE_ENV: production
      BASE_PATH: "/dev"
      PUBLIC_URL: https://bibai.t0waxx.com
      DATABASE_URL: postgres://bibai:${POSTGRES_PASSWORD:?}@postgres:5432/env_dev
      JWT_SECRET: ${JWT_SECRET_DEV:?}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      STORAGE_DIR: /data/storage
    volumes:
