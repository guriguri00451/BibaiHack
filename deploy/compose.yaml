# 生成物。直接編集せず deploy/envs.txt を直して ./deploy/render.sh を実行する
# bibai-game VM（wds-pve VMID 100）の /opt/bibai に置いて使う。https://bibai.t0waxx.com
name: bibai

x-server: &server
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bibai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: bibai
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibai -d bibai"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server-prod:
    <<: *server
    build: ./envs/prod/server
    image: bibai-server:prod
    environment:
      NODE_ENV: production
      BASE_PATH: ""
      PUBLIC_URL: https://bibai.t0waxx.com
      DATABASE_URL: postgres://bibai:${POSTGRES_PASSWORD:?}@postgres:5432/env_prod
      JWT_SECRET: ${JWT_SECRET_PROD:?}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      STORAGE_DIR: /data/storage
    volumes:
      - storage-prod:/data/storage

  server-stg:
    <<: *server
    build: ./envs/stg/server
    image: bibai-server:stg
    environment:
      NODE_ENV: production
      BASE_PATH: "/stg"
      PUBLIC_URL: https://bibai.t0waxx.com
      DATABASE_URL: postgres://bibai:${POSTGRES_PASSWORD:?}@postgres:5432/env_stg
      JWT_SECRET: ${JWT_SECRET_STG:?}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      STORAGE_DIR: /data/storage
    volumes:
      - storage-stg:/data/storage

  server-dev:
