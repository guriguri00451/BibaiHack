    path: ^/stg(/|$)
    service: http://server-stg:8080
  - hostname: bibai.t0waxx.com
    path: ^/dev(/|$)
    service: http://server-dev:8080
  - hostname: bibai.t0waxx.com
    path: ^/a-kun-01(/|$)
    service: http://server-a-kun-01:8080
  - hostname: bibai.t0waxx.com
    path: ^/a-kun-02(/|$)
    service: http://server-a-kun-02:8080
  - hostname: bibai.t0waxx.com
    path: ^/a-kun-03(/|$)
    service: http://server-a-kun-03:8080
  - hostname: bibai.t0waxx.com
    path: ^/so-ma-01(/|$)
    service: http://server-so-ma-01:8080
  - hostname: bibai.t0waxx.com
    path: ^/so-ma-02(/|$)
    service: http://server-so-ma-02:8080
  - hostname: bibai.t0waxx.com
